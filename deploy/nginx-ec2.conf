# nginx на EC2: проксирует домен через WireGuard на mediaserver.
# Замените cinema.example.com и 10.0.0.5 (WireGuard-IP mediaserver).
# Сертификат: sudo certbot --nginx -d cinema.example.com

server {
    listen 80;
    server_name cinema.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cinema.example.com;

    # ssl_certificate / ssl_certificate_key добавит certbot

    location / {
        proxy_pass http://10.0.0.5:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # стриминг: не буферизовать видео на EC2, передавать Range как есть
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
